services:
   db:
      image: pgvector/pgvector:pg18
      environment:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
      ports:
        - "5433:5432"
      volumes:
        - pgdata:/var/lib/postgresql
      healthcheck:
        test: ["CMD-SHELL","pg_isready -U rag -d rag"]
        interval: 2s
        retries: 15

volumes:
   pgdata: